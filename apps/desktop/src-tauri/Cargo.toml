[package]
name = "epoch-vtt"
version = "0.1.0"
description = "Project Epoch - A system-agnostic virtual tabletop for TTRPGs"
authors = ["entaiho"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.53.2", features = ["sync", "time", "macros"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
uuid = { version = "1.27.0", features = ["v4"] }
sha2 = "0.11.0"
base64 = "0.23.1"
